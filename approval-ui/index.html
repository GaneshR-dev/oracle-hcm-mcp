<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HCM approvals (unofficial)</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Pending HCM write approvals</h1>
      <p class="sub">Unofficial · localhost only · not an Oracle product · v0.7</p>
    </header>
    <aside class="disclaimer">Approve / deny only mutations you understand. Credentials and Fusion RBAC still apply. Under <code>--write</code> this queue is unused. The approval token is a <strong>separate principal</strong> — it is never returned by MCP tools.</aside>
    <div class="row">
      <label>MCP HTTP base <input id="base" value="http://127.0.0.1:8788" autocomplete="off" /></label>
      <label>Bearer / approval token <input id="token" type="password" placeholder="ORACLE_HCM_HTTP_TOKEN" autocomplete="off" /></label>
      <label>Domain
        <select id="domain">
          <option value="">All domains</option>
          <option>absence</option>
          <option>worker</option>
          <option>learning</option>
          <option>compensation</option>
          <option>documents</option>
          <option>journeys</option>
          <option>performance</option>
          <option>benefits</option>
          <option>recruiting</option>
          <option>platform</option>
          <option>other</option>
        </select>
      </label>
      <button id="refresh" class="btn primary" type="button">Refresh</button>
      <button id="bulkApprove" class="btn" type="button">Bulk approve visible</button>
      <button id="exportAudit" class="btn" type="button">Export audit</button>
    </div>
    <pre id="status" class="result" hidden></pre>
    <ul id="list" class="list"></ul>
  </main>
  <script src="/app.js"></script>
</body>
</html>
